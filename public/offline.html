<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1A42A6" />
    <title>You're offline | Enski</title>
    <meta name="robots" content="noindex" />
    <script>
      try {
        var t = localStorage.getItem("enski-theme");
        if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        if (t === "dark") document.documentElement.className = "dark";
      } catch (e) {}
    </script>
    <style>
      * { box-sizing: border-box; }
      html { background: #1a42a6; }
      html.dark { background: #0b1330; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 56px 24px;
        overflow-x: hidden;
        font-family: "Plus Jakarta Sans Variable", "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif;
        color: #fff;
        text-align: center;
      }
      main { position: relative; max-width: 460px; display: flex; flex-direction: column; align-items: center; }
      .glow { position: fixed; border-radius: 999px; background: rgba(255, 255, 255, 0.06); pointer-events: none; }
      .glow.a { width: 420px; height: 420px; left: -130px; top: -130px; }
      .glow.b { width: 480px; height: 480px; right: -100px; bottom: -160px; background: rgba(255, 255, 255, 0.05); }
      .logo { height: 44px; width: auto; }
      .logo.lime, html.dark .logo.white { display: none; }
      html.dark .logo.lime { display: block; }
      .icon { position: relative; width: 96px; height: 96px; margin-top: 48px; display: grid; place-items: center; }
      .ring { position: absolute; inset: 0; border-radius: 999px; border: 2px solid rgba(194, 242, 74, 0.6); animation: ring 2.4s cubic-bezier(0.2, 0.6, 0.3, 1) infinite; }
      .ring.late { animation-delay: 1.2s; border-color: rgba(194, 242, 74, 0.4); }
      .disc { width: 80px; height: 80px; border-radius: 999px; display: grid; place-items: center; background: rgba(255, 255, 255, 0.1); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.2); }
      @keyframes ring { 0% { transform: scale(0.85); opacity: 0.9; } 100% { transform: scale(1.6); opacity: 0; } }
      h1 { margin: 36px 0 12px; font-size: 32px; font-weight: 800; line-height: 1.15; letter-spacing: -0.02em; }
      p { margin: 0; font-size: 17px; line-height: 1.6; color: rgba(255, 255, 255, 0.82); }
      .status { margin-top: 20px; min-height: 44px; font-size: 14px; font-weight: 600; color: #ccdaf7; }
      .row { margin-top: 16px; display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; width: 100%; }
      button, a.btn {
        display: inline-flex; align-items: center; justify-content: center; gap: 8px;
        min-height: 56px; min-width: 170px; padding: 0 30px; border-radius: 999px;
        font: inherit; font-weight: 800; font-size: 18px; text-decoration: none; cursor: pointer;
      }
      button { border: 0; background: #c2f24a; color: #0a1f55; }
      button:hover { background: #ade02f; }
      a.btn { border: 2px solid #fff; color: #fff; background: transparent; }
      a.btn:hover { background: rgba(255, 255, 255, 0.12); }
      button:focus-visible, a:focus-visible { outline: none; box-shadow: 0 0 0 3px #7cc2f7; }
      [hidden] { display: none !important; }
      @media (max-width: 520px) { button, a.btn { width: 100%; } }
      @media (prefers-reduced-motion: reduce) { .ring { animation: none; opacity: 0.35; } }
    </style>
  </head>
  <body>
    <div class="glow a" aria-hidden="true"></div>
    <div class="glow b" aria-hidden="true"></div>
    <main role="alert" aria-labelledby="t">
      <img class="logo white" src="/brand/enski-logo-white.webp" alt="Enski" width="288" height="106" />
      <img class="logo lime" src="/brand/enski-logo-lime.webp" alt="Enski" width="288" height="106" />
      <div class="icon" aria-hidden="true">
        <span class="ring"></span><span class="ring late"></span>
        <span class="disc">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#c2f24a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 20h.01" /><path d="M8.5 16.43a5 5 0 0 1 7 0" /><path d="M5 12.86a10 10 0 0 1 5.17-2.69" />
            <path d="M19 12.86a10 10 0 0 0-2.01-1.51" /><path d="M2 8.82a15 15 0 0 1 4.18-2.65" />
            <path d="M22 8.82a15 15 0 0 0-11.29-3.76" /><path d="m2 2 20 20" />
          </svg>
        </span>
      </div>
      <h1 id="t">You're offline</h1>
      <p>We can't connect to the internet right now. Please check your network connection and try again.</p>
      <div id="status" class="status" role="status" aria-live="polite">We'll reconnect automatically as soon as you're back online.</div>
      <div class="row">
        <button id="retry" type="button">Try again</button>
        <a id="back" class="btn" href="/" hidden>Go back</a>
      </div>
    </main>
    <script>
      (function () {
        var status = document.getElementById("status");
        var retry = document.getElementById("retry");
        var back = document.getElementById("back");
        var reloading = false;
        // Reload only once, and only when the connection really is back: no loops.
        function reconnect() {
          if (reloading || !navigator.onLine) return false;
          reloading = true;
          status.textContent = "You're back online. Loading the page…";
          location.reload();
          return true;
        }
        retry.addEventListener("click", function () {
          if (!reconnect()) status.textContent = "Still no connection. We'll keep listening and reconnect on our own.";
        });
        if (history.length > 1) {
          back.hidden = false;
          back.addEventListener("click", function (e) { e.preventDefault(); history.back(); });
        }
        window.addEventListener("online", reconnect);
        setInterval(function () { if (navigator.onLine) reconnect(); }, 5000);
        retry.focus();
      })();
    </script>
  </body>
</html>
